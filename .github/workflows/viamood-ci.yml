name: ViaMood code checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viamood_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viamood_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viamood_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: test-auth-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxx
      SHOPIFY_STORE_DOMAIN: test.myshopify.com
      APP_URL: https://hesap.viamood.com.tr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck production sources
        run: npx tsc --noEmit -p tsconfig.deploy.json
      - name: Create isolated integration database schema
        shell: bash
        run: |
          set -euo pipefail
          npx drizzle-kit migrate
          # First-run test DB: unlike prod, 0007 runs once and then database is discarded.
          for file in $(find drizzle -maxdepth 1 -name '*.sql' | sort -V); do
            name="$(basename "$file")"
            case "$name" in
              0000_*|0001_*|0002_*|0003_*|0004_*|0005_*|MANUEL-*) continue ;;
            esac
            echo "Migrating: $name"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Unit, security and real-Postgres integration tests
        run: npx vitest run
